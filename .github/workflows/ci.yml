# Integração contínua: lint e testes da API e do frontend, e testes E2E. Sem deploy.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Runners fixados em ubuntu-24.04 temporariamente, durante a migração do ubuntu-latest para a
# 26.04 (19/10–19/11/2026). Testar a 26.04 depois de 19/11 e revisar até 15/12/2026.
# docs/development/dependencias.md
jobs:
  api:
    name: API (Laravel)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/api

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: cs_tactical_test
          POSTGRES_USER: cs_tactical
          POSTGRES_PASSWORD: cs_tactical_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cs_tactical -d cs_tactical_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: cs_tactical
      DB_PASSWORD: cs_tactical_ci
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_pgsql, redis, pcntl
          coverage: none

      - name: Cache do Composer
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('apps/api/composer.lock') }}

      - run: composer install --no-interaction --no-progress --prefer-dist

      - name: Preparar .env
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Pint
        run: vendor/bin/pint --test

      - name: Larastan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Migrations
        run: php artisan migrate --force --database=pgsql
        env:
          DB_DATABASE: cs_tactical_test

      - name: Pest
        run: vendor/bin/pest

  web:
    name: Web (Next.js)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/web/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm lint

      - name: Prettier
        run: pnpm format:check

      - name: TypeScript
        run: pnpm typecheck

      - name: Vitest
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          API_INTERNAL_URL: http://localhost:8000

  e2e:
    # Mesma stack isolada usada localmente (compose.e2e.yaml, scripts/e2e.sh). docs/development/e2e.md
    name: E2E (Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Preparar ambiente (.env, imagens, dependências, APP_KEY)
        run: ./scripts/setup.sh

      - name: Playwright (Chromium desktop)
        run: ./scripts/e2e.sh --project=chromium-desktop

      - name: Publicar relatório, screenshots, traces e logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: |
            apps/web/e2e/.report/
            apps/web/e2e/.results/
          retention-days: 14
          if-no-files-found: ignore
