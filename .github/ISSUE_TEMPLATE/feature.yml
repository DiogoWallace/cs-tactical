name: Feature
description: Funcionalidade nova ou mudança de comportamento do produto.
title: "[FEATURE] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Uma issue = uma entrega verificável. Decisões arquiteturais relevantes pedem ADR
        (`docs/decisions/`). Política: `docs/governance/issue-policy.md`.
  - type: textarea
    id: problem
    attributes:
      label: Problema ou necessidade
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Objetivo
      description: O resultado esperado, do ponto de vista de quem usa.
    validations:
      required: true
  - type: textarea
    id: requirements
    attributes:
      label: Requisitos
      description: Regras de negócio, autorização, limites, dados.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Escopo
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Fora do escopo
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Critérios de aceite
      description: Verificáveis; incluam os testes (Pest, Vitest, Playwright, concorrência).
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependências
      description: Issues ou PRs (#número).
  - type: textarea
    id: references
    attributes:
      label: Referências técnicas
      description: Planos, ADRs, contratos, código.
