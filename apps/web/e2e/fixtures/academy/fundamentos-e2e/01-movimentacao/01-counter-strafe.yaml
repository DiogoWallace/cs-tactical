content:
  version: 1
  blocks:
    - type: markdown
      text: |
        ## Por que parar antes de atirar

        A precisão cai enquanto o personagem se move. O **counter-strafe** zera a velocidade.

        - Solte a tecla do movimento
        - Toque a tecla *oposta*

        ```
        bind "mouse4" "+left"
        ```

        Leia o [guia externo](https://example.com/guia) ou volte ao [catálogo](/academy).
    - type: image
      src: grafico.png
      alt: Gráfico da velocidade caindo a zero
      caption: A velocidade cai a zero logo depois da tecla oposta.
    - type: callout
      variant: tip
      title: Treine offline
      text: Ande com **A**, toque **D** e atire.
