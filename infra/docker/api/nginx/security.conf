##
# Headers de segurança da API (etapa 1.8). Substitui /etc/nginx/server-opts.d/security.conf da
# imagem serversideup/php. docs/architecture/seguranca-http.md
#
# A API só responde JSON e nunca é exibida como página: nada de frames, scripts ou referrer.
# HSTS NÃO é enviado aqui: é responsabilidade da borda de produção (TLS), ver
# docs/deploy/bloqueios-de-producao.md (P1). A imagem original o enviava inclusive em HTTP.
##

add_header X-Frame-Options           "DENY" always;
add_header X-Content-Type-Options    "nosniff" always;
add_header Referrer-Policy           "no-referrer" always;
add_header Content-Security-Policy   "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;

# ------------------------------------------------------------------------------
# Restrições de acesso a arquivos (mantidas da configuração original da imagem)
# ------------------------------------------------------------------------------

# Arquivos e pastas ocultos, exceto /.well-known/ (RFC 8615).
location ~ /\.(?!well-known) {
    deny all;
}

# Arquivos que podem expor informação sensível (H5BP).
location ~* (?:#.*#|\.(?:bak|conf|config|dist|inc|ini|log|sh|sql|sw[op])|~)$ {
    deny all;
}
