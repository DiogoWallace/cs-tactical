name: cs-tactical

services:
  web:
    build:
      context: ./infra/docker/web
      args:
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
    image: cs-tactical-web:dev
    restart: unless-stopped
    env_file:
      - path: ./apps/web/.env
        required: true
    environment:
      # Endereço da API na rede interna, usado pelos rewrites e pelo serverFetch.
      API_INTERNAL_URL: http://api:8080
    volumes:
      - ./apps/web:/app
      - pnpm-store:/home/node/.local/share/pnpm
      - corepack-cache:/home/node/.cache
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    networks:
      internal:
        # IP fixo: é o único remetente cujos X-Forwarded-* a API aceita (TRUSTED_PROXIES, ADR 0009).
        ipv4_address: ${WEB_INTERNAL_IP:-172.31.250.10}

  api: &api
    build:
      context: ./infra/docker/api
      target: development
      args:
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
    image: cs-tactical-api:dev
    restart: unless-stopped
    env_file:
      - path: ./apps/api/.env
        required: true
    environment: &api-environment
      # Conexões definidas aqui têm prioridade sobre apps/api/.env (fonte única: .env da raiz).
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-cs_tactical}
      DB_USERNAME: ${POSTGRES_USER:-cs_tactical}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      # Desenvolvimento: sem OPcache para que alterações no código valham na hora.
      PHP_OPCACHE_ENABLE: 0
      PHP_DISPLAY_ERRORS: "On"
      # Rota de health check nativa do Laravel (liveness).
      HEALTHCHECK_PATH: /up
      SHOW_WELCOME_MESSAGE: "false"
      # O Nginx da imagem não reescreve o IP (real_ip desligado): quem decide é o Laravel.
      TRUSTED_PROXY: off
      # Único proxy confiável: o container web. X-Forwarded-* de qualquer outro remetente
      # (inclusive do gateway do Docker, por onde chega a porta 8000 do host) é ignorado.
      TRUSTED_PROXIES: ${WEB_INTERNAL_IP:-172.31.250.10}
      # Escuta só IPv4: evita falha do Nginx em ambientes sem IPv6 (comum em Docker/WSL).
      NGINX_LISTEN_IP_PROTOCOL: ipv4
    volumes:
      - ./apps/api:/var/www/html
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [internal]

  worker:
    <<: *api
    command: ["php", "/var/www/html/artisan", "queue:work", "--tries=3", "--timeout=90"]
    stop_signal: SIGTERM
    ports: []
    healthcheck:
      # Healthcheck nativo da imagem para processos que não são HTTP.
      test: ["CMD", "healthcheck-queue"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cs_tactical}
      POSTGRES_USER: ${POSTGRES_USER:-cs_tactical}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    volumes:
      # A partir do Postgres 18 o volume é montado em /var/lib/postgresql (não mais em /data).
      - postgres-data:/var/lib/postgresql
      - ./infra/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [internal]

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [internal]

  mailpit:
    image: axllent/mailpit:v1.30
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [internal]

networks:
  internal:
    name: cs-tactical-internal
    ipam:
      config:
        - subnet: ${INTERNAL_SUBNET:-172.31.250.0/24}
          # IPs dinâmicos só na metade superior, para nunca colidirem com o IP fixo do web.
          ip_range: ${INTERNAL_IP_RANGE:-172.31.250.128/25}

volumes:
  postgres-data:
  redis-data:
  pnpm-store:
  corepack-cache:
